name: Public content and local permissions

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: PDF inspection dependency
        run: python -m pip install -r scripts/requirements-check.txt
      - name: Local permission tests
        run: python -m unittest discover -s Implementacion/app -p 'test_store.py' -v
      - name: Public content guard tests
        run: python -m unittest discover -s scripts -p 'test_public_content.py' -v
      - name: Public content inspection
        run: python scripts/check_public_content.py
