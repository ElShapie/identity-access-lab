<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1280" viewBox="0 0 1500 1280"><rect width="100%" height="100%" fill="white"/>
<text x="45" y="64" font-family="Times New Roman, Times, serif" font-size="34" font-weight="700" fill="black">Recorrido de demostración</text>
<text x="45" y="101" font-family="Times New Roman, Times, serif" font-size="21" font-weight="400" fill="black">Las pruebas de cambio y baja se ejecutan al final para conservar el estado inicial.</text>
<polyline points="45,125 1455,125" fill="none" stroke="black" stroke-width="2"/>
<rect x="230" y="175" width="1040" height="125" rx="12" fill="white" stroke="black" stroke-width="2"/>
<text x="248" y="213" font-family="Times New Roman, Times, serif" font-size="24" font-weight="700" fill="black">1. Preparación de identidad</text>
<text x="248" y="246" font-family="Times New Roman, Times, serif" font-size="22" font-weight="400" fill="black">RRHH, TI e IAM muestran alta, rol, contraseña y MFA.</text>
<polyline points="750,300 750,333" fill="none" stroke="black" stroke-width="3"/>
<polygon points="750,333 744.345448056554,321.2941876694152 755.654551943446,321.2941876694152" fill="black"/>
<rect x="230" y="338" width="1040" height="125" rx="12" fill="white" stroke="black" stroke-width="2"/>
<text x="248" y="376" font-family="Times New Roman, Times, serif" font-size="24" font-weight="700" fill="black">2. Visitante rechazado</text>
<text x="248" y="409" font-family="Times New Roman, Times, serif" font-size="22" font-weight="400" fill="black">Tarjeta no autorizada. LED rojo. Cámara y CSV.</text>
<polyline points="750,463 750,496" fill="none" stroke="black" stroke-width="3"/>
<polygon points="750,496 744.345448056554,484.2941876694152 755.654551943446,484.2941876694152" fill="black"/>
<rect x="230" y="501" width="1040" height="125" rx="12" fill="white" stroke="black" stroke-width="2"/>
<text x="248" y="539" font-family="Times New Roman, Times, serif" font-size="24" font-weight="700" fill="black">3. Ingeniero entra y trabaja</text>
<text x="248" y="572" font-family="Times New Roman, Times, serif" font-size="22" font-weight="400" fill="black">Tarjeta permitida. OneLogin + MFA. Mantenimiento permitido.</text>
<polyline points="750,626 750,659" fill="none" stroke="black" stroke-width="3"/>
<polygon points="750,659 744.345448056554,647.2941876694152 755.654551943446,647.2941876694152" fill="black"/>
<rect x="230" y="664" width="1040" height="125" rx="12" fill="white" stroke="black" stroke-width="2"/>
<text x="248" y="702" font-family="Times New Roman, Times, serif" font-size="24" font-weight="700" fill="black">4. Auditor prueba una función restringida</text>
<text x="248" y="735" font-family="Times New Roman, Times, serif" font-size="22" font-weight="400" fill="black">Login correcto, pero mantenimiento devuelve 403.</text>
<polyline points="750,789 750,822" fill="none" stroke="black" stroke-width="3"/>
<polygon points="750,822 744.345448056554,810.2941876694152 755.654551943446,810.2941876694152" fill="black"/>
<rect x="230" y="827" width="1040" height="125" rx="12" fill="white" stroke="black" stroke-width="2"/>
<text x="248" y="865" font-family="Times New Roman, Times, serif" font-size="24" font-weight="700" fill="black">5. Cierre de sesión y salida</text>
<text x="248" y="898" font-family="Times New Roman, Times, serif" font-size="22" font-weight="400" fill="black">Aplicación registra logout; lector registra salida; video confirma.</text>
<polyline points="750,952 750,985" fill="none" stroke="black" stroke-width="3"/>
<polygon points="750,985 744.345448056554,973.2941876694152 755.654551943446,973.2941876694152" fill="black"/>
<rect x="230" y="990" width="1040" height="125" rx="12" fill="white" stroke="black" stroke-width="2"/>
<text x="248" y="1028" font-family="Times New Roman, Times, serif" font-size="24" font-weight="700" fill="black">6. Cambio, baja y revisión</text>
<text x="248" y="1061" font-family="Times New Roman, Times, serif" font-size="22" font-weight="400" fill="black">SCIM actualiza/revoca. SOC reconstruye. Auditoría presenta evidencia.</text>
<text x="45" y="1254" font-family="Times New Roman, Times, serif" font-size="18" font-weight="400" fill="black">IDENTITY ACCESS LAB | Diseño de laboratorio | 02/10/2026</text>
</svg>
